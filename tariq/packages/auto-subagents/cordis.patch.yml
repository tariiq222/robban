# Apply after the Web bundle. Auto owns the live model-selection service.
- id: llm
  disabled: true
- id: subagent-model-selection-settings
  disabled: true
- insert:
    - id: auto-llm
      name: dsh-auto-subagents/llm-provider
    - id: auto-model-selection
      name: dsh-auto-subagents/model-selection
      config:
        enabled: false
        allowedModels: []
        modelTiers: []
    - id: dsh-auto-subagents
      name: dsh-auto-subagents
# Default xKiro route for the base bundle's dormant pi-ai adapter. A profile patch that
# sets this row's config replaces these providers. The key is never stored here: requests
# resolve XKIRO_API_KEY per request and fail with MISSING_CREDENTIAL until one is saved.
- id: llm-pi-ai
  config:
    providers:
      xkiro:
        apiKeyEnv: XKIRO_API_KEY
        displayName: xKiro
        api: openai-completions
        baseURL: https://api.xkiro.com/v1
        models:
          - id: openai/gpt-6.1-sol
            name: GPT-6.1 Sol
            contextWindow: 1050000
            maxTokens: 65536
            input: [text, image]
          - id: openai/gpt-6-luna
